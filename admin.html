<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>管理後台</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f4f5f7; margin: 0; padding: 0 0 30px;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .header {
    width: 100%; background: linear-gradient(135deg, #1a1a2e, #0f3460);
    color: #fff; padding: 20px 20px 16px; text-align: center;
  }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-sub { font-size: 12px; opacity: .65; margin-top: 3px; }

  /* Tabs */
  .tabs {
    display: flex; width: 100%; max-width: 480px;
    background: #fff; border-bottom: 2px solid #eee;
    position: sticky; top: 0; z-index: 10;
  }
  .tab {
    flex: 1; padding: 8px 2px; line-height: 1.35; border: none; background: transparent;
    font-size: 13px; font-weight: 600; color: #999; cursor: pointer;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
    transition: all 0.2s;
  }
  .tab.active { color: #0f3460; border-bottom-color: #0f3460; }

  .panel { display: none; width: 100%; max-width: 480px; padding: 16px; }
  .panel.active { display: block; }

  /* Month bar */
  .month-bar {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    background: #fff; border-radius: 12px; padding: 10px 16px;
    margin-bottom: 14px; box-shadow: 0 1px 6px rgba(0,0,0,.06);
  }
  .month-bar button {
    border: none; background: #eee; border-radius: 8px;
    width: 32px; height: 32px; font-size: 16px; cursor: pointer; color: #444;
  }
  .month-label { font-size: 15px; font-weight: 700; color: #333; min-width: 90px; text-align: center; }

  /* Employee card */
  .emp-card {
    background: #fff; border-radius: 12px; padding: 14px 16px;
    margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.06);
  }
  .emp-header { display: flex; align-items: center; justify-content: space-between; }
  .emp-name { font-size: 15px; font-weight: 700; color: #222; }
  .badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px;
    border-radius: 20px; white-space: nowrap;
  }
  .badge-in   { background: #e6f9ee; color: #06C755; }
  .badge-out  { background: #e8f5e9; color: #2e7d32; }
  .badge-none { background: #f5f5f5; color: #aaa; }
  .badge-holiday { background: #fff3e0; color: #FF8C00; }
  .emp-times { font-size: 12px; color: #777; margin-top: 6px; }

  /* Monthly detail */
  .emp-card.collapsible { cursor: pointer; }
  .emp-card .summary { display: flex; gap: 16px; margin-top: 6px; }
  .summary-item { font-size: 12px; color: #777; }
  .summary-item strong { color: #333; font-size: 13px; }
  .detail-rows { display: none; margin-top: 10px; border-top: 1px solid #f0f0f0; padding-top: 10px; }
  .detail-rows.open { display: block; }
  .day-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 1px solid #f8f8f8; font-size: 12px;
  }
  .day-date { color: #555; font-weight: 600; }
  .day-times { color: #888; }
  .day-hours { color: #0f3460; font-weight: 700; }

  /* Leave */
  .leave-card {
    background: #fff; border-radius: 12px; padding: 14px 16px;
    margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.06);
  }
  .leave-name { font-size: 14px; font-weight: 700; color: #222; margin-bottom: 6px; }
  .leave-item {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #666; padding: 4px 0; border-top: 1px solid #f5f5f5;
  }


  .badge-wait { background: #fff4e0; color: #cc7000; }

  /* 上班表（月曆） */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-wd { text-align: center; font-size: 11px; font-weight: 700; color: #888; padding: 2px 0 4px; }
  .cal-wd.we { color: #e74c3c; }
  .cal-cell {
    background: #fff; border-radius: 8px; min-height: 74px; padding: 3px 2px 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; overflow: hidden;
    display: flex; flex-direction: column; gap: 2px; border: 2px solid transparent;
  }
  .cal-cell.blank { background: transparent; box-shadow: none; cursor: default; }
  .cal-cell.leave { background: #fff7ec; }
  .cal-cell.today { border-color: #0f3460; }
  .cal-cell.sel { border-color: #f39c12; }
  .cal-num { font-size: 12px; font-weight: 800; color: #333; padding-left: 3px; }
  .cal-num.we { color: #e74c3c; }
  .tag { font-size: 10px; line-height: 1.35; border-radius: 4px; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag.work  { background: #e6f9ee; color: #06A046; }
  .tag.leave { background: #f39c12; color: #fff; font-weight: 700; }
  .tag.more  { color: #999; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 14px; white-space: nowrap; display: inline-block; margin: 2px 0; }
  .chip.work  { background: #e6f9ee; color: #06A046; }
  .chip.leave { background: #f39c12; color: #fff; font-weight: 700; }
  .cal-detail { background: #fff; border-radius: 12px; padding: 12px 14px; margin-top: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.06); font-size: 13px; line-height: 1.8; }
  .cal-detail b { color: #0f3460; }
  .cal-sum { background: #fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.06); font-size: 13px; color: #555; }
  .badge-ok   { background: #e6f9ee; color: #06A046; }
  .badge-no   { background: #fdeeee; color: #e74c3c; }
  .req-sub { font-size: 12px; color: #777; margin-top: 5px; line-height: 1.5; }
  .sec-title { font-size: 14px; font-weight: 700; color: #0f3460; margin: 6px 2px 8px; }

  .loading { text-align: center; color: #aaa; font-size: 14px; padding: 40px 0; }
  .empty   { text-align: center; color: #bbb; font-size: 14px; padding: 40px 0; }
  .refresh-btn {
    display: block; margin: 0 auto 14px;
    background: #0f3460; color: #fff; border: none;
    border-radius: 10px; padding: 9px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-title" id="hdrTitle">📊 管理後台</div>
  <div class="header-sub" id="adminName">載入中...</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('today')">📅<br>今日</button>
  <button class="tab" onclick="switchTab('monthly')">📊<br>月份打卡</button>
  <button class="tab" onclick="switchTab('calendar')">🗓️<br>上班表</button>
  <button class="tab" onclick="switchTab('requests')">📝<br>申請</button>
  <button class="tab" onclick="switchTab('payroll')">💰<br>薪資</button>
</div>

<!-- 今日打卡 -->
<div class="panel active" id="panel-today">
  <button class="refresh-btn" onclick="loadToday()">🔄 重新載入</button>
  <div id="today-list"><div class="loading">載入中...</div></div>
</div>

<!-- 月份打卡 -->
<div class="panel" id="panel-monthly">
  <div class="month-bar">
    <button onclick="changeMonth('monthly', -1)">‹</button>
    <div class="month-label" id="monthly-label"></div>
    <button onclick="changeMonth('monthly', 1)">›</button>
  </div>
  <button class="refresh-btn" onclick="loadMonthly()">🔄 重新載入</button>
  <div id="monthly-list"><div class="loading">載入中...</div></div>
</div>

<!-- 上班表 -->
<div class="panel" id="panel-calendar">
  <div class="month-bar">
    <button onclick="changeMonth('calendar', -1)">‹</button>
    <div class="month-label" id="calendar-label"></div>
    <button onclick="changeMonth('calendar', 1)">›</button>
  </div>
  <div style="font-size:12px;color:#888;text-align:center;margin:-4px 0 10px;">
    <span class="chip work">綠色</span> 有打卡上班　<span class="chip leave">橘色</span> 請假　點日子看詳細
  </div>
  <div id="calendar-list"><div class="loading">載入中...</div></div>
</div>

<!-- 請假／代墊付款申請 -->
<div class="panel" id="panel-requests">
  <button class="refresh-btn" onclick="loadRequests()">🔄 重新載入</button>
  <div style="font-size:12px;color:#888;text-align:center;margin:-6px 0 12px;">送出就算數，不用審核。想記錄的話，到試算表把狀態改成「已處理」或「取消」</div>
  <div id="requests-list"><div class="loading">載入中...</div></div>
</div>



<!-- 薪資 -->
<div class="panel" id="panel-payroll">
  <div class="month-bar">
    <button onclick="changeMonth('payroll', -1)">‹</button>
    <div class="month-label" id="payroll-label"></div>
    <button onclick="changeMonth('payroll', 1)">›</button>
  </div>
  <button class="refresh-btn" onclick="loadPayroll()">🔄 重新載入</button>
  <div id="payroll-list"><div class="loading">載入中...</div></div>
  <div style="font-size:12px;color:#888;text-align:center;margin:12px 0 20px;line-height:1.7;">
    薪資＝時數 × 時薪，扣款來自試算表「扣款記錄」與健保眷屬。<br>
    正式薪資單：試算表上方「打卡薪資」→「產生上個月薪資表」
  </div>
</div>

<script>
const LIFF_ID = CONFIG.LIFF_ADMIN;
const API_URL = CONFIG.API_URL;

const TABS = ['today', 'monthly', 'calendar', 'requests', 'payroll'];
let currentTab = 'today';
const thisMonth = new Date().toISOString().slice(0, 7);
const monthState = { monthly: thisMonth, calendar: thisMonth, payroll: thisMonth };
const loaders    = { monthly: loadMonthly, calendar: loadCalendar, payroll: loadPayroll };

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', TABS[i] === tab);
  });
  document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');

  if (loaders[tab]) { updateMonthLabel(tab); loaders[tab](); }
  if (tab === 'requests') loadRequests();
}

function fmtMonth(m) {
  const [y, mo] = m.split('-');
  return `${y} 年 ${parseInt(mo)} 月`;
}
function updateMonthLabel(type) {
  const el = document.getElementById(type + '-label');
  if (el) el.textContent = fmtMonth(monthState[type]);
}
function changeMonth(type, delta) {
  const d = new Date(monthState[type] + '-01T00:00:00');
  d.setMonth(d.getMonth() + delta);
  monthState[type] = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  updateMonthLabel(type);
  if (loaders[type]) loaders[type]();
}

// ── 今日打卡 ──
async function loadToday() {
  const el = document.getElementById('today-list');
  el.innerHTML = '<div class="loading">載入中...</div>';
  try {
    const res = await fetch(`${API_URL}?action=all_today`, { credentials: 'omit' });
    const result = await res.json();
    if (!result.success || !result.employees.length) {
      el.innerHTML = '<div class="empty">今日尚無打卡紀錄</div>'; return;
    }
    const sorted = result.employees.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
    el.innerHTML = sorted.map(emp => {
      const badge = emp.isHoliday
        ? `<span class="badge badge-holiday">假日加班</span>`
        : emp.status === 'in'
          ? `<span class="badge badge-in">上班中</span>`
          : emp.status === 'out'
            ? `<span class="badge badge-out">已下班</span>`
            : `<span class="badge badge-none">未打卡</span>`;
      const times = emp.inTime
        ? `上班 ${emp.inTime}${emp.outTime ? ' ／ 下班 ' + emp.outTime : ''}`
        : '尚未打卡';
      return `<div class="emp-card">
        <div class="emp-header">
          <span class="emp-name">👤 ${emp.name}</span>${badge}
        </div>
        <div class="emp-times">${times}</div>
      </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty">載入失敗：${e.message}</div>`;
  }
}

// ── 月份打卡 ──
async function loadMonthly() {
  const el = document.getElementById('monthly-list');
  el.innerHTML = '<div class="loading">載入中...</div>';
  try {
    const res = await fetch(`${API_URL}?action=all_monthly&month=${monthState.monthly}`, { credentials: 'omit' });
    const result = await res.json();
    if (!result.success || !result.employees.length) {
      el.innerHTML = '<div class="empty">該月無打卡紀錄</div>'; return;
    }
    const sorted = result.employees.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
    el.innerHTML = sorted.map((emp, idx) => {
      const dayRows = emp.days.map(d => `
        <div class="day-row">
          <span class="day-date">${d.date}</span>
          <span class="day-times">${d.inTime || '--'} ～ ${d.outTime || '--'}</span>
          <span class="day-hours">${d.hours}h</span>
        </div>`).join('');
      return `<div class="emp-card collapsible" onclick="toggleDetail(${idx})">
        <div class="emp-header">
          <span class="emp-name">👤 ${emp.name}</span>
          <span style="font-size:12px;color:#aaa;" id="arrow-${idx}">▼</span>
        </div>
        <div class="summary">
          <div class="summary-item">出勤 <strong>${emp.totalDays} 天</strong></div>
          <div class="summary-item">總工時 <strong>${emp.totalHours} h</strong></div>
        </div>
        <div class="detail-rows" id="detail-${idx}">${dayRows}</div>
      </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty">載入失敗：${e.message}</div>`;
  }
}

// ── 請假／代墊付款申請 ──
function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function reqBadge(status) {
  status = status || '已送出';
  const cls = ['已處理','核准'].includes(status) ? 'badge-ok' : ['取消','駁回'].includes(status) ? 'badge-no' : 'badge-wait';
  return `<span class="badge ${cls}">${escHtml(status)}</span>`;
}
async function loadRequests() {
  const el = document.getElementById('requests-list');
  el.innerHTML = '<div class="loading">載入中...</div>';
  try {
    const res = await fetch(`${API_URL}?action=all_requests`, { credentials: 'omit' });
    const result = await res.json();
    if (!result.success) throw new Error(result.message);
    const leave = result.leave.map(r => `
      <div class="leave-card">
        <div class="emp-header"><span class="emp-name">👤 ${escHtml(r.name)}・${escHtml(r.leaveType)}</span>${reqBadge(r.status)}</div>
        <div class="req-sub">${escHtml(r.start)} ～ ${escHtml(r.end)}${r.reason ? '<br>' + escHtml(r.reason) : ''}<br>送出 ${escHtml(r.submitted)}</div>
      </div>`).join('') || '<div class="empty" style="padding:16px 0;">沒有請假申請</div>';
    const expense = result.expense.map(r => `
      <div class="leave-card">
        <div class="emp-header"><span class="emp-name">👤 ${escHtml(r.name)}・$${Number(r.amount).toLocaleString()}</span>${reqBadge(r.status)}</div>
        <div class="req-sub">${escHtml(r.expenseType)}・${escHtml(r.item)}・${escHtml(r.date)}${r.note ? '<br>' + escHtml(r.note) : ''}<br>送出 ${escHtml(r.submitted)}</div>
      </div>`).join('') || '<div class="empty" style="padding:16px 0;">沒有代墊付款申請</div>';
    el.innerHTML = `<div class="sec-title">📝 請假</div>${leave}<div class="sec-title">💰 代墊／付款</div>${expense}`;
  } catch (e) {
    el.innerHTML = `<div class="empty">載入失敗：${escHtml(e.message)}</div>`;
  }
}

// ── 上班表：整個月的月曆，每天誰上班、誰請假 ──
let calDays = [], calSel = null;
const W = ['日', '一', '二', '三', '四', '五', '六'];
function todayStr() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
}
function workersOf(d) { const ln = d.leave.map(l => l.name); return d.worked.filter(n => !ln.includes(n)); }
function renderCalendar() {
  const el = document.getElementById('calendar-list');
  if (!calDays.length) { el.innerHTML = '<div class="empty">沒有資料</div>'; return; }
  const today = todayStr();
  const [y, m] = calDays[0].date.split('-').map(Number);
  const firstWd = new Date(y, m - 1, 1).getDay();
  const leaveDays = calDays.filter(d => d.leave.length).length;
  const leaveCount = calDays.reduce((t, d) => t + d.leave.length, 0);

  let html = `<div class="cal-sum">本月有 <b>${leaveDays}</b> 天有人請假（共 ${leaveCount} 人次）</div><div class="cal-grid">`;
  html += W.map((w, i) => `<div class="cal-wd${i === 0 || i === 6 ? ' we' : ''}">${w}</div>`).join('');
  for (let i = 0; i < firstWd; i++) html += '<div class="cal-cell blank"></div>';
  calDays.forEach(d => {
    const dd = Number(d.date.slice(8));
    const wd = (firstWd + dd - 1) % 7;
    const tags = d.leave.map(l => `<div class="tag leave">${escHtml(l.name)} 假</div>`)
      .concat(workersOf(d).map(n => `<div class="tag work">${escHtml(n)}</div>`));
    const shown = tags.length > 4 ? tags.slice(0, 3).concat(`<div class="tag more">+${tags.length - 3}</div>`) : tags;
    const cls = ['cal-cell', d.leave.length ? 'leave' : '', d.date === today ? 'today' : '', d.date === calSel ? 'sel' : ''].join(' ');
    html += `<div class="${cls}" onclick="selectDay('${d.date}')">
      <div class="cal-num${wd === 0 || wd === 6 ? ' we' : ''}">${dd}</div>${shown.join('')}</div>`;
  });
  html += '</div><div id="cal-detail"></div>';
  el.innerHTML = html;
  if (calSel) showDetail(calSel);
}
function selectDay(date) { calSel = date; renderCalendar(); }
function showDetail(date) {
  const d = calDays.find(x => x.date === date);
  if (!d) return;
  const [, m, dd] = date.split('-').map(Number);
  const wd = new Date(date + 'T00:00:00').getDay();
  const leave = d.leave.map(l => `<span class="chip leave">${escHtml(l.name)}・${escHtml(l.leaveType)}${l.time === '全天' ? '' : ' ' + escHtml(l.time)}</span>`).join(' ');
  const work = workersOf(d).map(n => `<span class="chip work">${escHtml(n)}</span>`).join(' ');
  document.getElementById('cal-detail').innerHTML = `<div class="cal-detail">
    <b>${m}/${dd}（${W[wd]}）</b><br>
    請假：${leave || '沒有'}<br>
    上班：${work || (date > todayStr() ? '還沒到' : '沒有人打卡')}
  </div>`;
}
async function loadCalendar() {
  const el = document.getElementById('calendar-list');
  el.innerHTML = '<div class="loading">載入中...</div>';
  try {
    const res = await fetch(`${API_URL}?action=calendar&month=${monthState.calendar}`, { credentials: 'omit' });
    const result = await res.json();
    if (!result.success) throw new Error(result.message);
    calDays = result.days;
    renderCalendar();
  } catch (e) {
    el.innerHTML = `<div class="empty">載入失敗：${escHtml(e.message)}</div>`;
  }
}

// ── 薪資（只有老闆看得到）──
async function postAdmin(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ accessToken: liff.getAccessToken(), ...payload })
  });
  return res.json();
}
let payrollRows = [];
async function loadPayroll() {
  const el = document.getElementById('payroll-list');
  el.innerHTML = '<div class="loading">載入中...</div>';
  try {
    const result = await postAdmin({ action: 'payroll', month: monthState.payroll });
    if (!result.success) throw new Error(result.message);
    payrollRows = result.employees;
    if (!payrollRows.length) { el.innerHTML = '<div class="empty">這個月沒有員工資料</div>'; return; }
    const total = payrollRows.reduce((t, e) => t + e.net, 0);
    const money = n => '$' + Number(n).toLocaleString();
    el.innerHTML = `
      <div class="emp-card" style="text-align:center;">
        <div style="font-size:13px;color:#888;">本月實付合計</div>
        <div style="font-size:26px;font-weight:800;color:#0f3460;">${money(total)}</div>
      </div>` + payrollRows.map((e, i) => `
      <div class="emp-card">
        <div class="emp-header">
          <span class="emp-name">👤 ${escHtml(e.name)}</span>
          <span style="font-size:12px;color:#888;">${escHtml(e.title)}</span>
        </div>
        <div class="summary">
          <div class="summary-item">出勤 <strong>${e.days} 天</strong></div>
          <div class="summary-item">工時 <strong>${e.hours} h</strong></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin:10px 0;">
          <span style="font-size:13px;color:#555;white-space:nowrap;">時薪</span>
          <input id="rate-${i}" type="number" inputmode="numeric" min="1" value="${e.rate || ''}" placeholder="請輸入時薪"
            style="flex:1;min-width:0;padding:9px;border:1.5px solid ${e.rate ? '#ddd' : '#e67e22'};border-radius:8px;font-size:16px;">
          <button onclick="saveRate(${i})" id="save-${i}"
            style="background:#06C755;color:#fff;border:none;border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px;">儲存</button>
        </div>
        ${e.rate ? `<div class="req-sub" style="line-height:1.8;">
          薪資 ${e.hours} h × ${money(e.rate)} ＝ <b>${money(e.pay)}</b><br>
          ${e.deduction ? `扣款 −${money(e.deduction)}<br>` : ''}
          <span style="font-size:15px;color:#0f3460;font-weight:800;">實付 ${money(e.net)}</span>
        </div>` : '<div class="req-sub" style="color:#e67e22;">還沒設定時薪，填好按儲存就會算薪資</div>'}
      </div>`).join('');
  } catch (e) {
    el.innerHTML = `<div class="empty">載入失敗：${escHtml(e.message)}</div>`;
  }
}
async function saveRate(i) {
  const e = payrollRows[i];
  const rate = Number(document.getElementById('rate-' + i).value);
  if (!(rate > 0)) { alert('請輸入時薪'); return; }
  const btn = document.getElementById('save-' + i);
  btn.disabled = true; btn.textContent = '儲存中';
  try {
    const result = await postAdmin({ action: 'set_rate', userId: e.userId, name: e.name, rate });
    if (!result.success) throw new Error(result.message);
    loadPayroll();
  } catch (err) {
    alert('儲存失敗：' + err.message);
    btn.disabled = false; btn.textContent = '儲存';
  }
}

function toggleDetail(idx) {
  const el = document.getElementById('detail-' + idx);
  const ar = document.getElementById('arrow-' + idx);
  el.classList.toggle('open');
  ar.textContent = el.classList.contains('open') ? '▲' : '▼';
}





async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    document.getElementById('hdrTitle').textContent  = '📊 ' + CONFIG.COMPANY_NAME + ' 管理後台';
    document.getElementById('adminName').textContent = profile.displayName;
    TABS.slice(1).forEach(updateMonthLabel);
    loadToday();
  } catch(e) {
    document.getElementById('adminName').textContent = '初始化失敗：' + e.message;
  }
}
main();
</script>
